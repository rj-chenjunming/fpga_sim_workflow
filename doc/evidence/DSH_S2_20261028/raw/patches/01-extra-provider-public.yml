# 探针用 overlay：把默认路由切到内网 provider（与宿主 web profile 同构）
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      public:
        displayName: public
        apiKeyEnv: PUBLIC_API_KEY
        api: openai-responses
        baseURL: https://<internal-uniapi>/v1
        models:
          - id: origin-deepseek-v4-1-flash
            name: origin-deepseek-v4-1-flash
            contextWindow: 1000000
            maxTokens: 384000
            input: [text, image]
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: public
    model: origin-deepseek-v4-1-flash
