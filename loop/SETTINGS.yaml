# 编排层非机密配置。
#
# **本文件不放任何密钥**：密钥在运行时解析（`$LOOP_LLM_API_KEY` → 宿主 DSH 凭据库
# `~/.dsh/.credentials.yaml` 的 `refs.<apiKeyEnv>`），见 `host/model_provider.py`。
#
# 留空即**回退到宿主 `~/.dsh/settings.yaml` 已声明的 provider** ——
# 在仓库里再抄一份内部端点，早晚会和宿主配置漂移。
loop:
  # 2026-10-28 人工裁决（S5）：**六个模型节点全部显式走 dsh**，Agently 保留可一键回退
  # （`default_backend` 仍 `agently`；未列入 `node_backends` 的节点仍走默认）。
  # 准入 ≠ 默认：只有 `enabled=true` + `DshConfig.verify(wrap_required=True)` + 启动自检 +
  # 版本/指纹全通过才返回 `DshBackend`；任一不满足仍 `BackendUnavailable`，**不静默回退 Agently**。
  # mode 分层（S5 C1）：`LOOP_LLM_MODE=standin` ⇒ 确定性替身；`drill` ⇒ 替身；
  # 只有 `real` + live 才走 dsh 准入链；`run_mode` 未声明（旧调用）⇒ 严格失败。
  agent_runtime:
    default_backend: agently
    node_backends:
      N3: dsh
      N6: dsh
      N8: dsh
      N10: dsh
      N11: dsh
      N12: dsh
    # S1（SPEC-REV-14）：执行器骨架；`enabled=false` 时 select() 仍显式 BackendUnavailable
    # （REV-14 §1：不因实现存在而放行）。启用须同时指纹匹配 + 启动自检通过。
    # 注意：patch 文件必须放在 attempt 目录内（包裹会遮蔽宿主 home，仓内路径不可见）。
    dsh:
      enabled: true
      version: "0.2.1-rc.2"
      node: "/home/soft/DSH/node/bin/node"
      bin: "/home/soft/DSH/versions/0.2.1-rc.2/node_modules/@deepseek-ai/dsh/lib/bin.js"
      bin_sha256: "80112efe368efb1a39720c7ada0af00442e5131fb2744edaaff8a3e8bb499e6f"
      profile: headless
      # S7a（2026-10-29 人工裁决 B1）：单次真实调用授权上限 = 300 s。配置必须与授权**同一个数**
      # （S5 有过"文档写 120 s、实际 600 s"的违规，已记档）；探针在真机前 `assert` 本值 == 300。
      timeout_s: 300
      stop_grace_s: 5
      wrap: true
      patches: []
      api_key_env: PUBLIC_API_KEY
      # S7b 工具白名单（人工裁决 B2，2026-10-29）：把真机工具面从 26 项全量 harness 收到显式允清单。
      # 判据唯一实现在 `host/agent_backends/dsh_allowlist.py`；插件只执行判据（`dsh_plugin/tool_allowlist.mjs`）。
      # `enabled: false` ⇒ 插件根本不挂 + 不渲染 env + 不进出指纹 = 与 S6 行为**逐字相同**（可一键回退）。
      # `bash` 保留并单独登记为**已接受暴露面**（N6 实测用 `ls`/`md5sum`；禁掉显著降成功率）。
      # 注意：`list`/`apply_patch` 在 0.2.1-rc.2 的 26 项里不存在 ⇒ 按真实名单落地（见 STATUS §119、
      # 计划 §8-6）；清单里写不存在的工具名会让准入**显式失败**（不静默忽略）。
      tool_allowlist:
        enabled: true
        accept_bash: true
        # true = deny + 收窄 agent 可见面（模型只看到 7 项）；false = 只 deny（模型仍看到 26 项）
        enforce_visibility: true
  llm:
    # 留空 = 用宿主声明的 api family（本机为 openai-responses）。
    # 可选值：openai-responses | chat（= chat/completions）
    family: ""
    base_url: ""
    model: ""
    # 密钥环境变量名；宿主凭据库里同名 ref 就是它的值
    api_key_env: PUBLIC_API_KEY
    # 本网关的模型是推理模型：token 会被 reasoning 吃光，给不足则 content 为空（实测 max_tokens=32 ⇒ 空）
    max_tokens: 8000
    timeout_s: 180
    # 留空 = 取 shell 的 HTTPS_PROXY/HTTP_PROXY。
    # **必须显式设**：插件写死 trust_env=False，环境代理不会被 httpx 读取（实测会 DNS 失败）
    proxy: ""
